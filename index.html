<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D Character Sheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1, h2 {
      margin-bottom: 10px;
    }

    .card {
      background: #1f2937;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    label {
      display: block;
      font-size: 14px;
      margin-top: 10px;
      color: #d1d5db;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: none;
      background: #374151;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .stat-box {
      text-align: center;
      background: #374151;
      padding: 12px;
      border-radius: 10px;
    }

    .stat-box input {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .modifier {
      margin-top: 6px;
      font-size: 18px;
      color: #93c5fd;
    }

    button {
      padding: 10px 14px;
      margin: 5px 5px 5px 0;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .danger {
      background: #dc2626;
    }

    .danger:hover {
      background: #b91c1c;
    }

    .success {
      background: #16a34a;
    }

    .success:hover {
      background: #15803d;
    }

    .small-buttons button {
      width: auto;
    }

    .death-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .checkbox-row {
      display: flex;
      gap: 8px;
    }

    .checkbox-row input {
      width: 22px;
      height: 22px;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>D&D Character Sheet</h1>

    <div class="card">
      <h2>Character Info</h2>
      <div class="grid">
        <div>
          <label>Character Name</label>
          <input id="name" placeholder="Ex: Kael Stormborn">
        </div>
        <div>
          <label>Player Name</label>
          <input id="player" placeholder="Ex: Andy">
        </div>
        <div>
          <label>Race</label>
          <input id="race" placeholder="Ex: Human">
        </div>
        <div>
          <label>Class</label>
          <input id="class" placeholder="Ex: Fighter">
        </div>
        <div>
          <label>Level</label>
          <input id="level" type="number" value="1">
        </div>
        <div>
          <label>Background</label>
          <input id="background" placeholder="Ex: Soldier">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Main Stats</h2>
      <div class="grid">
        <div>
          <label>Armor Class</label>
          <input id="ac" type="number" value="10">
        </div>
        <div>
          <label>Initiative</label>
          <input id="initiative" placeholder="+0">
        </div>
        <div>
          <label>Speed</label>
          <input id="speed" placeholder="30 ft">
        </div>
        <div>
          <label>Proficiency Bonus</label>
          <input id="prof" placeholder="+2">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Hit Points</h2>
      <div class="grid">
        <div>
          <label>Current HP</label>
          <input id="currentHp" type="number" value="10">
        </div>
        <div>
          <label>Max HP</label>
          <input id="maxHp" type="number" value="10">
        </div>
        <div>
          <label>Temp HP</label>
          <input id="tempHp" type="number" value="0">
        </div>
      </div>

      <div class="small-buttons">
        <button onclick="changeHp(1)">+1 HP</button>
        <button onclick="changeHp(5)">+5 HP</button>
        <button onclick="changeHp(-1)" class="danger">-1 HP</button>
        <button onclick="changeHp(-5)" class="danger">-5 HP</button>
        <button onclick="fullHeal()" class="success">Full Heal</button>
      </div>

      <h3>Death Saves</h3>
      <div class="death-row">
        <span>Successes:</span>
        <div class="checkbox-row">
          <input type="checkbox" id="ds1">
          <input type="checkbox" id="ds2">
          <input type="checkbox" id="ds3">
        </div>
      </div>
      <div class="death-row">
        <span>Failures:</span>
        <div class="checkbox-row">
          <input type="checkbox" id="df1">
          <input type="checkbox" id="df2">
          <input type="checkbox" id="df3">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Ability Scores</h2>
      <div class="grid">
        <div class="stat-box">
          <label>Strength</label>
          <input id="str" type="number" value="10" oninput="updateModifiers(); saveData();">
          <div class="modifier" id="strMod">+0</div>
        </div>
        <div class="stat-box">
          <label>Dexterity</label>
          <input id="dex" type="number" value="10" oninput="updateModifiers(); saveData();">
          <div class="modifier" id="dexMod">+0</div>
        </div>
        <div class="stat-box">
          <label>Constitution</label>
          <input id="con" type="number" value="10" oninput="updateModifiers(); saveData();">
          <div class="modifier" id="conMod">+0</div>
        </div>
        <div class="stat-box">
          <label>Intelligence</label>
          <input id="int" type="number" value="10" oninput="updateModifiers(); saveData();">
          <div class="modifier" id="intMod">+0</div>
        </div>
        <div class="stat-box">
          <label>Wisdom</label>
          <input id="wis" type="number" value="10" oninput="updateModifiers(); saveData();">
          <div class="modifier" id="wisMod">+0</div>
        </div>
        <div class="stat-box">
          <label>Charisma</label>
          <input id="cha" type="number" value="10" oninput="updateModifiers(); saveData();">
          <div class="modifier" id="chaMod">+0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Skills & Saves</h2>
      <label>Saving Throws</label>
      <textarea id="saves" placeholder="Ex: Strength +4, Constitution +3"></textarea>

      <label>Skills</label>
      <textarea id="skills" placeholder="Ex: Athletics +4, Perception +2"></textarea>
    </div>

    <div class="card">
      <h2>Weapons & Actions</h2>
      <textarea id="weapons" placeholder="Ex: Longsword +5 to hit, 1d8+3 slashing"></textarea>
    </div>

    <div class="card">
      <h2>Features & Traits</h2>
      <textarea id="features" placeholder="Class features, racial traits, feats, etc."></textarea>
    </div>

    <div class="card">
      <h2>Spell Slots</h2>
      <div class="grid">
        <div>
          <label>Level 1</label>
          <input id="spell1" placeholder="0/0">
        </div>
        <div>
          <label>Level 2</label>
          <input id="spell2" placeholder="0/0">
        </div>
        <div>
          <label>Level 3</label>
          <input id="spell3" placeholder="0/0">
        </div>
        <div>
          <label>Level 4</label>
          <input id="spell4" placeholder="0/0">
        </div>
        <div>
          <label>Level 5</label>
          <input id="spell5" placeholder="0/0">
        </div>
      </div>

      <label>Spells</label>
      <textarea id="spells" placeholder="Cantrips and prepared spells"></textarea>
    </div>

    <div class="card">
      <h2>Inventory & Notes</h2>
      <label>Inventory</label>
      <textarea id="inventory" placeholder="Gold, weapons, armor, items"></textarea>

      <label>Notes</label>
      <textarea id="notes" placeholder="Story notes, quests, NPCs, etc."></textarea>
    </div>

    <div class="card">
      <h2>Dice Roller</h2>
      <button onclick="rollDice(4)">Roll d4</button>
      <button onclick="rollDice(6)">Roll d6</button>
      <button onclick="rollDice(8)">Roll d8</button>
      <button onclick="rollDice(10)">Roll d10</button>
      <button onclick="rollDice(12)">Roll d12</button>
      <button onclick="rollDice(20)">Roll d20</button>
      <h3 id="diceResult">Result: -</h3>
    </div>

    <div class="card">
      <button onclick="saveData()" class="success">Save Sheet</button>
      <button onclick="resetSheet()" class="danger">Reset Sheet</button>
    </div>

    <div class="footer">
      Character sheet saves automatically on this device.
    </div>
  </div>

  <script>
    const fields = [
      "name", "player", "race", "class", "level", "background",
      "ac", "initiative", "speed", "prof",
      "currentHp", "maxHp", "tempHp",
      "str", "dex", "con", "int", "wis", "cha",
      "saves", "skills", "weapons", "features",
      "spell1", "spell2", "spell3", "spell4", "spell5",
      "spells", "inventory", "notes",
      "ds1", "ds2", "ds3", "df1", "df2", "df3"
    ];

    function getModifier(score) {
      const mod = Math.floor((score - 10) / 2);
      return mod >= 0 ? "+" + mod : mod;
    }

    function updateModifiers() {
      document.getElementById("strMod").textContent = getModifier(Number(document.getElementById("str").value));
      document.getElementById("dexMod").textContent = getModifier(Number(document.getElementById("dex").value));
      document.getElementById("conMod").textContent = getModifier(Number(document.getElementById("con").value));
      document.getElementById("intMod").textContent = getModifier(Number(document.getElementById("int").value));
      document.getElementById("wisMod").textContent = getModifier(Number(document.getElementById("wis").value));
      document.getElementById("chaMod").textContent = getModifier(Number(document.getElementById("cha").value));
    }

    function saveData() {
      const data = {};

      fields.forEach(id => {
        const element = document.getElementById(id);
        if (element.type === "checkbox") {
          data[id] = element.checked;
        } else {
          data[id] = element.value;
        }
      });

      localStorage.setItem("dndCharacterSheet", JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem("dndCharacterSheet");
      if (!saved) return;

      const data = JSON.parse(saved);

      fields.forEach(id => {
        const element = document.getElementById(id);
        if (!element || data[id] === undefined) return;

        if (element.type === "checkbox") {
          element.checked = data[id];
        } else {
          element.value = data[id];
        }
      });

      updateModifiers();
    }

    function changeHp(amount) {
      const currentHp = document.getElementById("currentHp");
      const maxHp = Number(document.getElementById("maxHp").value);
      let newHp = Number(currentHp.value) + amount;

      if (newHp > maxHp) newHp = maxHp;
      currentHp.value = newHp;

      saveData();
    }

    function fullHeal() {
      document.getElementById("currentHp").value = document.getElementById("maxHp").value;
      document.getElementById("tempHp").value = 0;

      ["ds1", "ds2", "ds3", "df1", "df2", "df3"].forEach(id => {
        document.getElementById(id).checked = false;
      });

      saveData();
    }

    function rollDice(sides) {
      const result = Math.floor(Math.random() * sides) + 1;
      document.getElementById("diceResult").textContent = "Result: " + result + " on a d" + sides;
    }

    function resetSheet() {
      const confirmReset = confirm("Are you sure you want to reset this character sheet?");
      if (!confirmReset) return;

      localStorage.removeItem("dndCharacterSheet");
      location.reload();
    }

    document.querySelectorAll("input, textarea").forEach(element => {
      element.addEventListener("input", saveData);
      element.addEventListener("change", saveData);
    });

    loadData();
    updateModifiers();
  </script>
</body>
</html>
